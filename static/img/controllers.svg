<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-labelledby="t d">
  <title id="t">Rig Controller の形の模式図</title>
  <desc id="d">FK の輪、IK の箱、ポールの菱形、Root の輪を並べた模式図。アバターは描いていない。</desc>
  <rect x="0" y="0" width="520" height="200" fill="none"/>
  <!-- FK: 骨の軸まわりの細い輪 -->
  <circle cx="70" cy="90" r="38" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <line x1="70" y1="90" x2="70" y2="40" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="70" y="160" font-size="15" text-anchor="middle" fill="currentColor">FK（回転）</text>
  <!-- IK: 12 辺の箱 -->
  <rect x="160" y="50" width="70" height="70" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="160" y1="50" x2="130" y2="50" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="195" y="160" font-size="15" text-anchor="middle" fill="currentColor">IK（位置）</text>
  <!-- ポール: 菱形と、肘・膝への実線 -->
  <polygon points="300,55 325,80 300,105 275,80" fill="#facc15" stroke="#a16207" stroke-width="1.5"/>
  <line x1="300" y1="105" x2="300" y2="140" stroke="#a16207" stroke-width="2"/>
  <text x="300" y="160" font-size="15" text-anchor="middle" fill="currentColor">ポール（向き）</text>
  <!-- Root: 塗りのない輪と四方の矢印 -->
  <circle cx="430" cy="90" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="430" y1="48" x2="430" y2="34" stroke="currentColor" stroke-width="2"/>
  <line x1="430" y1="132" x2="430" y2="146" stroke="currentColor" stroke-width="2"/>
  <line x1="388" y1="90" x2="374" y2="90" stroke="currentColor" stroke-width="2"/>
  <line x1="472" y1="90" x2="486" y2="90" stroke="currentColor" stroke-width="2"/>
  <text x="430" y="182" font-size="15" text-anchor="middle" fill="currentColor">Root（全身）</text>
</svg>
